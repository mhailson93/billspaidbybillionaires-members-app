# Render Blueprint — Bills Paid by Billionaires members app
# $13/mo total: $7 Web Service (Starter) + $6 Postgres (Basic).
# Deploy with: render.com → New → Blueprint → point at this repo.
# Secrets are set in the Render dashboard, NOT in this file.
services:
  - type: web
    name: bills-members-app
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bills-db
          property: connectionString
      - key: APP_URL
        value: https://bills-members-app.onrender.com
      - key: STRIPE_PRICE_ID
        value: price_1Ucv1sPkgBJAsgZQzpgD2FCw
      # Set these three in the Render dashboard (never commit them):
      #   SESSION_SECRET (generate a long random string)
      #   STRIPE_SECRET_KEY (sk_test_... first, then sk_live_...)
      #   STRIPE_WEBHOOK_SECRET (whsec_... from the webhook below)

databases:
  - name: bills-db
    plan: basic
